<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React Native Counter App Preview</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .phone-frame {
            background: #fff;
            width: 375px;
            height: 667px;
            border-radius: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .status-bar {
            height: 44px;
            background: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 12px;
        }

        .container {
            flex: 1;
            background: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .hello-text {
            font-size: 32px;
            font-weight: bold;
            color: #333;
            margin-bottom: 40px;
            animation: fadeIn 0.6s ease-in;
        }

        .counter-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px;
            background: #f5f5f5;
            border-radius: 15px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            animation: slideUp 0.6s ease-out;
        }

        .counter-label {
            font-size: 24px;
            color: #666;
            margin-bottom: 10px;
        }

        .counter-value {
            font-size: 64px;
            font-weight: bold;
            color: #007AFF;
            margin-bottom: 30px;
            min-width: 100px;
            text-align: center;
            transition: transform 0.2s ease;
        }

        .counter-value.pulse {
            animation: pulse 0.3s ease;
        }

        .button-container {
            display: flex;
            gap: 15px;
        }

        .button {
            background: #007AFF;
            color: #fff;
            border: none;
            padding: 15px 25px;
            border-radius: 10px;
            min-width: 70px;
            font-size: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0, 122, 255, 0.2);
        }

        .button:hover {
            background: #0056b3;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 122, 255, 0.3);
        }

        .button:active {
            transform: translateY(0);
            box-shadow: 0 2px 4px rgba(0, 122, 255, 0.2);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }

        .preview-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 122, 255, 0.9);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="preview-badge">PREVIEW</div>
        <div class="status-bar">
            <span>9:41</span>
            <span>📶 📡 🔋</span>
        </div>
        <div class="container">
            <div class="hello-text">Hello World!</div>
            <div class="counter-container">
                <div class="counter-label">Counter</div>
                <div id="counter-value" class="counter-value">0</div>
                <div class="button-container">
                    <button class="button" onclick="decrementCounter()">-</button>
                    <button class="button" onclick="resetCounter()">Reset</button>
                    <button class="button" onclick="incrementCounter()">+</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let count = 0;
        const counterElement = document.getElementById('counter-value');

        function updateCounter() {
            counterElement.textContent = count;
            counterElement.classList.add('pulse');
            setTimeout(() => {
                counterElement.classList.remove('pulse');
            }, 300);
        }

        function incrementCounter() {
            count++;
            updateCounter();
        }

        function decrementCounter() {
            count--;
            updateCounter();
        }

        function resetCounter() {
            count = 0;
            updateCounter();
        }
    </script>
</body>
</html>
